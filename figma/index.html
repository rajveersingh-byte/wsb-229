<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" />
    <link rel="stylesheet" href="asstes/css/style.css" />
    <link rel="stylesheet" href="asstes/css/media.css" />
</head>

<body>

    <header>
        <div class="conatiner">
            <div class="row">
                <div class="logo">
                    <img src="asstes/img/logo.svg" alt="WsCube Tech/">
                </div>

                <div class="btn">
                    <button><i class="fa-brands fa-whatsapp"></i> Chat with Us</button>
                    <button>Call Us</button>
                </div>
            </div>
        </div>
    </header>

    <section>
        <div class="conatiner">
            <div class="row">
                <div class="hero-content">
                    <h1>Career Opportunities in<span>Digital Marketing</span> </h1>
                    <p>Digital marketing course so good,you only pay-after-placement</p>

                    <ul>
                        <li><img src="asstes/img/frame.png" />Specialization: Performance Marketing</li>
                        <li><img src="asstes/img/frame.png" />Min salary of Rs 4.5 LPA</li>
                        <li><img src="asstes/img/frame.png" />50 seats only</li>
                    </ul>

                    <div class="hero-btn">
                        <button>Book 2 Days Demo</button>
                        <button><i class="fa-solid fa-download"></i> Download Curriculum</button>
                    </div>
                </div>

                <div class="hero-contact">

                    <form action="">
                        <h2>Contact Us</h2>
                        <div>
                            <label>Name</label>
                            <input type="text" placeholder="Enter your name" />
                        </div>

                        <div>
                            <label>Email</label>
                            <input type="email" placeholder="Enter your Email" />
                        </div>

                        <div>
                            <label>Mobile Number</label>
                            <input type="tel" placeholder="Enter your mobile number" />
                        </div>

                        <div class="form-btn">
                            <button>Register Now</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </section>


</body>

</html>
